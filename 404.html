<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 – Page Not Found | Toxic Movie</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0a0a0c;
            color: #f0ece4;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .error-page {
            max-width: 600px;
            padding: 40px 24px;
            position: relative;
            z-index: 1;
        }

        .error-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 30% 40%, rgba(92, 26, 42, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 60%, rgba(45, 27, 78, 0.1) 0%, transparent 60%),
                #0a0a0c;
        }

        .error-code {
            font-size: clamp(6rem, 20vw, 12rem);
            font-weight: 900;
            letter-spacing: 10px;
            line-height: 1;
            background: linear-gradient(180deg, #f0ece4 0%, #c9a84c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
            filter: drop-shadow(0 4px 30px rgba(201, 168, 76, 0.2));
        }

        .error-title {
            font-size: 1.2rem;
            font-weight: 400;
            color: #a8a3a0;
            margin-bottom: 8px;
        }

        .error-message {
            font-size: 0.95rem;
            color: #6b6765;
            font-style: italic;
            margin-bottom: 40px;
        }

        .error-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 16px 40px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            color: #f0ece4;
            background: linear-gradient(135deg, #8b1a1a, #5c1a2a);
            border: 1px solid rgba(139, 26, 26, 0.4);
            border-radius: 28px;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .error-btn:hover {
            background: linear-gradient(135deg, #c0392b, #8b1a1a);
            box-shadow: 0 0 30px rgba(139, 26, 26, 0.3);
            transform: translateY(-2px);
        }

        .error-btn:active {
            transform: translateY(0) scale(0.98);
        }

        .error-logo {
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #e4c96a, #c9a84c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 40px;
            display: block;
        }

        .grain {
            position: fixed;
            inset: 0;
            z-index: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="error-bg"></div>
    <div class="grain"></div>
    <div class="error-page">
        <span class="error-logo">TOXIC</span>
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-message">"Looks like this scene doesn't exist."</p>
        <a href="./" class="error-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Back to Home
        </a>
    </div>
</body>
</html>
